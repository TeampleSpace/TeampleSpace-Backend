plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.teamplespace'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.security:spring-security-oauth2-jose'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-mysql'
	// PDF 자료의 쪽수와 본문 추출
	implementation 'org.apache.pdfbox:pdfbox:3.0.8'
	// 링크 자료의 제목과 본문 추출
	implementation 'org.jsoup:jsoup:1.24.1'
	implementation 'org.apache.httpcomponents.client5:httpclient5'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'com.networknt:json-schema-validator:3.0.9'
	// 파일 출력 실험용. 내보내기 기능을 만들 때 운영 의존성으로 옮길지 정한다
	testImplementation 'org.apache.poi:poi-ooxml:6.0.0'
}

tasks.named('test') {
	useJUnitPlatform()
	// 계약 파일이나 출력 실험 산출물이 바뀌면 테스트를 다시 실행한다
	inputs.dir('contracts')
	inputs.dir('experiments/export/output')
}
