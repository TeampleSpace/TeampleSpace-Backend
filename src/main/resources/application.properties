spring.application.name=teamplespace-backend

# DB 연결. 기본값은 compose.yaml의 로컬 개발 DB
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/teamplespace?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USERNAME:teamplespace}
spring.datasource.password=${DB_PASSWORD:teamplespace}
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

# 스키마는 Flyway만 변경한다
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# 로그 줄마다 요청 식별자를 남긴다
logging.pattern.correlation=[%X{requestId:-}] 

# 미설정 인증 제공자는 사용하지 않는다
teamplespace.auth.secret=${AUTH_SECRET:}
teamplespace.auth.frontend-origin=${FRONTEND_ORIGIN:}
teamplespace.auth.backend-origin=${BACKEND_ORIGIN:}
teamplespace.auth.secure-cookie=${AUTH_SECURE_COOKIE:true}
teamplespace.auth.mail-from=${MAIL_FROM:}
teamplespace.auth.terms-version=${TERMS_VERSION:}
teamplespace.auth.terms-url=${TERMS_URL:}
teamplespace.auth.privacy-version=${PRIVACY_VERSION:}
teamplespace.auth.privacy-url=${PRIVACY_URL:}
teamplespace.auth.google.client-id=${GOOGLE_CLIENT_ID:}
teamplespace.auth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
teamplespace.auth.kakao.client-id=${KAKAO_CLIENT_ID:}
teamplespace.auth.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
teamplespace.auth.naver.client-id=${NAVER_CLIENT_ID:}
teamplespace.auth.naver.client-secret=${NAVER_CLIENT_SECRET:}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# 작업 처리. 임대 60초, 연장 15초, 내부 시도 3번은 설계서의 초기 제안값이다
teamplespace.jobs.worker-enabled=${JOBS_WORKER_ENABLED:true}
teamplespace.jobs.concurrency=${JOBS_CONCURRENCY:2}
teamplespace.jobs.lease=60s
teamplespace.jobs.heartbeat-interval=15s
teamplespace.jobs.max-attempts=3

# 파일 보관. 저장소 제공자가 정해지기 전까지 서버의 폴더에 둔다
teamplespace.storage.root=${STORAGE_ROOT:data/storage}
# PDF 크기 제한. 20MB는 검증용 기본값이고 기능 지원 정보로 알린다
teamplespace.materials.pdf-max-bytes=${MATERIAL_PDF_MAX_BYTES:20971520}

# 구성 생성은 운영자가 제공자와 모델을 준비한 뒤 활성화한다
teamplespace.outline.ai.enabled=${OUTLINE_AI_ENABLED:false}
teamplespace.outline.ai.model=${OUTLINE_AI_MODEL:}
teamplespace.outline.ai.key=${OPENAI_API_KEY:}
teamplespace.outline.ai.endpoint=${OUTLINE_AI_ENDPOINT:https://api.openai.com/v1/responses}

# 자료 요약은 사용자가 직접 요청할 때만 실행한다
teamplespace.materials.ai-summary.enabled=${MATERIAL_SUMMARY_AI_ENABLED:false}
teamplespace.materials.ai-summary.model=${MATERIAL_SUMMARY_AI_MODEL:}
teamplespace.materials.ai-summary.key=${OPENAI_API_KEY:}
teamplespace.materials.ai-summary.endpoint=${MATERIAL_SUMMARY_AI_ENDPOINT:https://api.openai.com/v1/responses}
