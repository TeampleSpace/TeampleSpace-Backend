# 테스트는 개발 DB와 분리된 DB를 사용한다
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/teamplespace_test?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
# 테스트는 실행자를 직접 돌려 순서를 정한다. 실행 풀이 필요한 테스트만 따로 켠다
teamplespace.jobs.worker-enabled=false
# 테스트 파일은 빌드 폴더에 둔다
teamplespace.storage.root=build/test-storage
