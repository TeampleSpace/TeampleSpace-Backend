name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: MySQL 8.4 실행
        run: docker compose up -d --wait
      - name: 빌드와 테스트
        run: ./gradlew build
      - name: 배포용 실행 파일과 체크섬 생성
        shell: bash
        run: |
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar')
          [[ ${#jars[@]} -eq 1 ]]
          unzip -p "${jars[0]}" META-INF/MANIFEST.MF | grep '^Start-Class: '
          release_dir="$RUNNER_TEMP/backend-release"
          mkdir "$release_dir"
          file="backend-$GITHUB_SHA.jar"
          cp "${jars[0]}" "$release_dir/$file"
          cd "$release_dir"
          sha256sum "$file" > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: main 배포 후보 보관
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: backend-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend-release/
          if-no-files-found: error
          compression-level: 0
      - name: MySQL 로그
        if: failure()
        run: docker compose logs mysql
