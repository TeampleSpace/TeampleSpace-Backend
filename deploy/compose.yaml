name: teamplespace-backend-dev
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: teamplespace
      MYSQL_USER: teamplespace
      MYSQL_PASSWORD: ${DB_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?}
      TZ: UTC
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s
  api:
    image: ${API_IMAGE:?}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: ./api.env
        required: false
    environment:
      DB_URL: "jdbc:mysql://db:3306/teamplespace?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=REQUIRED"
      DB_USERNAME: teamplespace
      DB_PASSWORD: ${DB_PASSWORD:?}
      STORAGE_ROOT: /srv/uploads
      AUTH_SECRET: ${AUTH_SECRET:?}
      AUTH_SECURE_COOKIE: "true"
    ports:
      - "127.0.0.1:18100:8080"
    volumes:
      - uploads:/srv/uploads
volumes:
  dbdata:
  uploads:
