# 로컬 개발과 CI용 MySQL. 계정 값은 로컬 전용이다
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: teamplespace
      MYSQL_USER: teamplespace
      MYSQL_PASSWORD: teamplespace
      TZ: UTC
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uteamplespace", "-pteamplespace"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
